openapi: 3.0.0
info:
  title: API Tienda Online LevelUp Gamer
  description: Documentación de servicios Firebase Firestore para la plataforma de comercio electrónico con roles de administrador, vendedor y cliente
  version: 1.0.0
  contact:
    name: Soporte Técnico
    email: soporte@levelupgamer.cl

servers:
  - url: /api
    description: API Local

security:
  - bearerAuth: []

tags:
  - name: Autenticación
    description: Servicios de login y autenticación de usuarios
  - name: Usuarios
    description: Gestión de usuarios (CRUD)
  - name: Productos
    description: Gestión de productos (CRUD)
  - name: Categorías
    description: Gestión de categorías de productos
  - name: Compras
    description: Gestión de compras/órdenes
  - name: Reseñas
    description: Gestión de reseñas de usuarios
  - name: Dashboard
    description: Estadísticas y resumen para administradores y vendedores

paths:
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión de usuario
      description: Servicio de autenticación que valida credenciales y devuelve información del usuario según su rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
                - clave
              properties:
                correo:
                  type: string
                  format: email
                  example: "cliente@ejemplo.com"
                clave:
                  type: string
                  example: "contraseña123"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAutenticado'
              example:
                id: "user123"
                nombre: "Cliente Ejemplo"
                correo: "cliente@ejemplo.com"
                run: "12345678-9"
                rol: "cliente"
                activo: true
                token: "jwt_token_aqui"
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Credenciales incorrectas"
                message: "Correo o contraseña inválidos"

  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Obtener lista de usuarios
      description: Servicio Firebase - DashboardManager.cargarUsuarios() / VendedorManager.cargarUsuarios()
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
              example:
                - id: "user123"
                  run: "12345678-9"
                  nombre: "Juan Pérez"
                  correo: "juan@ejemplo.com"
                  fecha: "1990-05-15"
                  telefono: "+56912345678"
                  direccion: "Calle Falsa 123"
                  rol: "cliente"
                  activo: true
                  createdAt: "2024-01-01T00:00:00Z"
                - id: "user456"
                  run: "87654321-0"
                  nombre: "María García"
                  correo: "maria@ejemplo.com"
                  fecha: "1985-10-20"
                  telefono: "+56987654321"
                  direccion: "Avenida Siempre Viva 456"
                  rol: "vendedor"
                  activo: true
                - id: "user789"
                  run: "11223344-5"
                  nombre: "Administrador"
                  correo: "admin@levelup.cl"
                  fecha: ""
                  telefono: ""
                  direccion: ""
                  rol: "admin"
                  activo: true
    post:
      tags:
        - Usuarios
      summary: Crear nuevo usuario
      description: Servicio Firebase - DashboardManager.guardarUsuario()
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
            example:
              run: "12345678-9"
              nombre: "Nuevo Usuario"
              correo: "nuevo@ejemplo.com"
              clave: "contraseña123"
              fecha: "1990-05-15"
              telefono: "+56912345678"
              direccion: "Calle Nueva 123"
              rol: "cliente"
              activo: true
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: "nuevoIdGeneradoPorFirestore123"
                message: "Usuario creado correctamente"
        '400':
          description: Datos de usuario inválidos

  /usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario por ID
      description: Servicio Firebase - DashboardManager.getUsuarioById()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "user123"
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: "user123"
                run: "12345678-9"
                nombre: "Juan Pérez"
                correo: "juan@ejemplo.com"
                fecha: "1990-05-15"
                telefono: "+56912345678"
                direccion: "Calle Falsa 123"
                rol: "cliente"
                activo: true
                createdAt: "2024-01-01T00:00:00Z"
        '404':
          description: Usuario no encontrado

    put:
      tags:
        - Usuarios
      summary: Actualizar usuario existente
      description: Servicio Firebase - DashboardManager.guardarUsuario()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "user123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
            example:
              run: "12345678-9"
              nombre: "Juan Pérez Actualizado"
              correo: "juan@ejemplo.com"
              fecha: "1990-05-15"
              telefono: "+56912345678"
              direccion: "Calle Falsa 123"
              rol: "cliente"
              activo: false
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Usuario actualizado correctamente"
        '404':
          description: Usuario no encontrado

    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario del sistema
      description: Servicio Firebase - DashboardManager.eliminarUsuario()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "user123"
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Usuario eliminado correctamente"
        '404':
          description: Usuario no encontrado

  /productos:
    get:
      tags:
        - Productos
      summary: Obtener lista de productos
      description: Servicio Firebase - DashboardManager.cargarProductos() / VendedorManager.cargarProductos()
      responses:
        '200':
          description: Lista de productos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
              example:
                - id: "prod123"
                  categoria: "Tecnología"
                  codigo: "LAP-001"
                  descripcion: "Laptop gaming de alta performance"
                  imagen: "https://ejemplo.com/laptop.jpg"
                  nombre: "Laptop Gaming"
                  precio: 1299990
                  precioAnterior: 1399990
                  stock: 15
                - id: "prod456"
                  categoria: "Accesorios"
                  codigo: "MOU-002"
                  descripcion: "Mouse inalámbrico ergonómico"
                  imagen: "https://ejemplo.com/mouse.jpg"
                  nombre: "Mouse Inalámbrico"
                  precio: 49990
                  precioAnterior: 59990
                  stock: 30
                - id: "prod789"
                  categoria: "Accesorios"
                  codigo: "KEY-003"
                  descripcion: "Teclado mecánico RGB"
                  imagen: "https://ejemplo.com/teclado.jpg"
                  nombre: "Teclado Mecánico"
                  precio: 89990
                  precioAnterior: 99990
                  stock: 25
    post:
      tags:
        - Productos
      summary: Crear un nuevo producto
      description: Servicio Firebase - DashboardManager.guardarProducto()
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
            example:
              categoria: "Tecnología"
              codigo: "TAB-004"
              descripcion: "Tablet Android 10 pulgadas"
              imagen: "https://ejemplo.com/tablet.jpg"
              nombre: "Tablet Android 10''"
              precio: 299990
              precioAnterior: 349990
              stock: 25
      responses:
        '201':
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: "nuevoIdGeneradoPorFirestore123"
        '400':
          description: Datos de producto inválidos

  /productos/{id}:
    get:
      tags:
        - Productos
      summary: Obtener producto por ID
      description: Servicio Firebase - DashboardManager.getProductoById()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "prod123"
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              example:
                id: "prod123"
                categoria: "Tecnología"
                codigo: "LAP-001"
                descripcion: "Laptop gaming de alta performance"
                imagen: "https://ejemplo.com/laptop.jpg"
                nombre: "Laptop Gaming"
                precio: 1299990
                precioAnterior: 1399990
                stock: 15
        '404':
          description: Producto no encontrado

    put:
      tags:
        - Productos
      summary: Actualizar producto existente
      description: Servicio Firebase - DashboardManager.guardarProducto()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "prod123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
            example:
              categoria: "Tecnología"
              codigo: "LAP-001"
              descripcion: "Laptop gaming de alta performance actualizada"
              imagen: "https://ejemplo.com/laptop.jpg"
              nombre: "Laptop Gaming Pro"
              precio: 1399990
              precioAnterior: 1499990
              stock: 10
      responses:
        '200':
          description: Producto actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Producto actualizado correctamente"
        '404':
          description: Producto no encontrado

    delete:
      tags:
        - Productos
      summary: Eliminar producto del sistema
      description: Servicio Firebase - DashboardManager.eliminarProducto()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "prod123"
      responses:
        '200':
          description: Producto eliminado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Producto eliminado correctamente"
        '404':
          description: Producto no encontrado

  /categorias:
    get:
      tags:
        - Categorías
      summary: Obtener lista de categorías
      description: Servicio Firebase - DashboardManager.cargarCategorias() / VendedorManager.cargarCategorias()
      responses:
        '200':
          description: Lista de categorías obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
              example:
                - id: "cat123"
                  nombre: "Electrónicos"
                  descripcion: "Dispositivos electrónicos y tecnológicos"
                  estado: "Activa"
                - id: "cat124"
                  nombre: "Hogar"
                  descripcion: "Productos para el hogar"
                  estado: "Activa"
                - id: "cat125"
                  nombre: "Ropa"
                  descripcion: "Ropa y accesorios"
                  estado: "Inactiva"
    post:
      tags:
        - Categorías
      summary: Crear nueva categoría
      description: Servicio Firebase - DashboardManager.guardarCategoria()
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
            example:
              nombre: "Deportes"
              descripcion: "Artículos deportivos"
              estado: "Activa"
      responses:
        '201':
          description: Categoría creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: "nuevoIdGeneradoPorFirestore123"
        '400':
          description: Datos de categoría inválidos

  /categorias/{id}:
    get:
      tags:
        - Categorías
      summary: Obtener categoría por ID
      description: Servicio Firebase - DashboardManager.getCategoriaById()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "cat123"
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
              example:
                id: "cat123"
                nombre: "Electrónicos"
                descripcion: "Dispositivos electrónicos y tecnológicos"
                estado: "Activa"
        '404':
          description: Categoría no encontrada

    put:
      tags:
        - Categorías
      summary: Actualizar categoría existente
      description: Servicio Firebase - DashboardManager.guardarCategoria()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "cat123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
            example:
              nombre: "Electrónicos Actualizados"
              descripcion: "Dispositivos electrónicos y tecnológicos actualizados"
              estado: "Activa"
      responses:
        '200':
          description: Categoría actualizada correctamente
          content:
            application/json:
              example:
                success: true
                message: "Categoría actualizada correctamente"
        '404':
          description: Categoría no encontrada

    delete:
      tags:
        - Categorías
      summary: Eliminar categoría del sistema
      description: Servicio Firebase - DashboardManager.eliminarCategoria()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "cat123"
      responses:
        '200':
          description: Categoría eliminada correctamente
          content:
            application/json:
              example:
                success: true
                message: "Categoría eliminada correctamente"
        '404':
          description: Categoría no encontrada

  /compras:
    get:
      tags:
        - Compras
      summary: Obtener lista de compras
      description: Servicio Firebase - PerfilCliente.cargarHistorialCompras() / DashboardManager.cargarOrdenes()
      responses:
        '200':
          description: Lista de compras obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Compra'
              example:
                - id: "comp123"
                  cliente:
                    run: "12345678-9"
                    nombre: "Juan Pérez"
                    correo: "juan@ejemplo.com"
                    telefono: "+56912345678"
                    direccion:
                      calle: "Calle Falsa"
                      comuna: "Santiago"
                      departamento: "123"
                      indicaciones: "Piso 5, Depto. 501"
                      region: "Metropolitana"
                  productos:
                    - id: "prod123"
                      nombre: "Laptop Gaming"
                      cantidad: 1
                      precio: 1299990
                    - id: "prod456"
                      nombre: "Mouse Inalámbrico"
                      cantidad: 1
                      precio: 49990
                  total: 1349980
                  estado: "completado"
                  fecha: "2024-01-15T10:30:00Z"
                - id: "comp124"
                  cliente:
                    run: "87654321-0"
                    nombre: "María García"
                    correo: "maria@ejemplo.com"
                    telefono: "+56987654321"
                    direccion:
                      calle: "Avenida Siempre Viva"
                      comuna: "Valparaíso"
                      departamento: "456"
                      indicaciones: "Casa, Portón Rojo"
                      region: "Valparaíso"
                  productos:
                    - id: "prod789"
                      nombre: "Teclado Mecánico"
                      cantidad: 2
                      precio: 89990
                  total: 179980
                  estado: "procesando"
                  fecha: "2024-01-14T15:45:00Z"

  /compras/{id}:
    get:
      tags:
        - Compras
      summary: Obtener compra por ID
      description: Servicio Firebase - DashboardManager.getOrdenById()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "comp123"
      responses:
        '200':
          description: Compra encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compra'
              example:
                id: "comp123"
                cliente:
                  run: "12345678-9"
                  nombre: "Juan Pérez"
                  correo: "juan@ejemplo.com"
                  telefono: "+56912345678"
                  direccion:
                    calle: "Calle Falsa"
                    comuna: "Santiago"
                    departamento: "123"
                    indicaciones: "Piso 5, Depto. 501"
                    region: "Metropolitana"
                productos:
                  - id: "prod123"
                    nombre: "Laptop Gaming"
                    cantidad: 1
                    precio: 1299990
                total: 1299990
                estado: "completado"
                fecha: "2024-01-15T10:30:00Z"
        '404':
          description: Compra no encontrada

  /compras/{id}/estado:
    put:
      tags:
        - Compras
      summary: Actualizar estado de compra
      description: Servicio Firebase - DashboardManager.updateOrdenEstado()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "comp123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  enum: [pendiente, procesando, completado, cancelado]
            example:
              estado: "completado"
      responses:
        '200':
          description: Estado actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Estado actualizado a completado"
        '404':
          description: Compra no encontrada

  /resenas:
    get:
      tags:
        - Reseñas
      summary: Obtener lista de reseñas
      description: Servicio Firebase - PerfilCliente.cargarHistorialResenas()
      responses:
        '200':
          description: Lista de reseñas obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resena'
              example:
                - id: "res123"
                  run: "12345678-9"
                  nombre: "Juan Pérez"
                  correo: "juan@ejemplo.com"
                  comentario: "Excelente producto, muy recomendado!"
                  fecha: "2024-01-15T10:30:00Z"
                - id: "res124"
                  run: "87654321-0"
                  nombre: "María García"
                  correo: "maria@ejemplo.com"
                  comentario: "Producto de buena calidad y rápido envío."
                  fecha: "2024-01-14T15:45:00Z"
    post:
      tags:
        - Reseñas
      summary: Crear nueva reseña
      description: Servicio Firebase - formularioContacto.js
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaInput'
            example:
              run: "12345678-9"
              nombre: "Juan Pérez"
              correo: "juan@ejemplo.com"
              comentario: "Excelente producto, muy recomendado!"
      responses:
        '201':
          description: Reseña creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: "nuevoIdGeneradoPorFirestore123"
        '400':
          description: Datos de reseña inválidos

  /resenas/{id}:
    get:
      tags:
        - Reseñas
      summary: Obtener reseña por ID
      description: Servicio Firebase - PerfilCliente.getResenaById()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "res123"
      responses:
        '200':
          description: Reseña encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resena'
              example:
                id: "res123"
                run: "12345678-9"
                nombre: "Juan Pérez"
                correo: "juan@ejemplo.com"
                comentario: "Excelente producto, muy recomendado!"
                fecha: "2024-01-15T10:30:00Z"
        '404':
          description: Reseña no encontrada

    delete:
      tags:
        - Reseñas
      summary: Eliminar reseña
      description: Servicio Firebase - PerfilCliente.eliminarResena()
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "res123"
      responses:
        '200':
          description: Reseña eliminada correctamente
          content:
            application/json:
              example:
                success: true
                message: "Reseña eliminada correctamente"
        '404':
          description: Reseña no encontrada

  /dashboard/estadisticas:
    get:
      tags:
        - Dashboard
      summary: Obtener estadísticas del dashboard
      description: Servicio Firebase - DashboardManager.cargarEstadisticasReales() / VendedorManager.cargarEstadisticasReales()
      responses:
        '200':
          description: Estadísticas obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasDashboard'
              example:
                totalVentas: 24
                proyeccionVentas: 15
                totalProductos: 156
                inventarioTotal: 1248
                totalUsuarios: 89
                nuevosUsuariosMes: 12

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UsuarioAutenticado:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        correo:
          type: string
          format: email
        run:
          type: string
        rol:
          type: string
          enum: [cliente, vendedor, admin]
        activo:
          type: boolean
        token:
          type: string

    Usuario:
      type: object
      properties:
        id:
          type: string
        run:
          type: string
        nombre:
          type: string
        correo:
          type: string
          format: email
        fecha:
          type: string
          format: date
        telefono:
          type: string
        direccion:
          type: string
        rol:
          type: string
          enum: [cliente, vendedor, admin]
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UsuarioInput:
      type: object
      required:
        - run
        - nombre
        - correo
        - clave
        - rol
      properties:
        run:
          type: string
          example: "12345678-9"
        nombre:
          type: string
          example: "Juan Pérez"
        correo:
          type: string
          format: email
          example: "juan@ejemplo.com"
        clave:
          type: string
          example: "contraseña123"
