openapi: 3.0.0
info:
  title: API Tienda Online LevelUp Gamer
  description: Documentación de servicios Firebase Firestore para la plataforma de comercio electrónico con roles de administrador, vendedor y cliente
  version: 1.0.0
  contact:
    name: Soporte Técnico
    email: soporte@levelupgamer.cl

servers:
  - url: https://firestore.googleapis.com/v1
    description: Firebase Firestore API

security:
  - bearerAuth: []

tags:
  - name: Autenticación
    description: Servicios de login y autenticación de usuarios
  - name: Usuarios
    description: Gestión de usuarios (creación, edición, roles)
  - name: Productos
    description: Gestión de productos (CRUD)
  - name: Categorías
    description: Gestión de categorías de productos
  - name: Compras/Órdenes
    description: Gestión de órdenes de compra
  - name: Dashboard
    description: Estadísticas y resumen para administradores y vendedores

paths:
  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión de usuario
      description: Servicio de autenticación que valida credenciales y devuelve información del usuario según su rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
                - clave
              properties:
                correo:
                  type: string
                  format: email
                  example: "cliente@ejemplo.com"
                clave:
                  type: string
                  example: "contraseña123"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAutenticado'
              example:
                id: "user123"
                nombre: "Cliente Ejemplo"
                correo: "cliente@ejemplo.com"
                run: "12345678-9"
                rol: "cliente"
                activo: true
                token: "jwt_token_aqui"
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Credenciales incorrectas"
                message: "Correo o contraseña inválidos"
        '403':
          description: Usuario inactivo o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/usuarios:
    get:
      tags:
        - Usuarios
      summary: Obtener lista de usuarios
      description: Servicio Firebase - DashboardManager.cargarUsuarios() - Solo para admins
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
              example:
                - id: "user123"
                  run: "12345678-9"
                  nombre: "Juan Pérez"
                  email: "juan@ejemplo.com"
                  fecha: "1990-05-15"
                  telefono: "+56912345678"
                  direccion: "Calle Falsa 123"
                  rol: "cliente"
                  activo: true
                  createdAt: "2024-01-01T00:00:00Z"
                - id: "user456"
                  run: "87654321-0"
                  nombre: "María García"
                  email: "maria@ejemplo.com"
                  fecha: "1985-10-20"
                  telefono: "+56987654321"
                  direccion: "Avenida Siempre Viva 456"
                  rol: "vendedor"
                  activo: true
                - id: "user789"
                  run: "11223344-5"
                  nombre: "Administrador"
                  email: "admin@levelup.cl"
                  fecha: ""
                  telefono: ""
                  direccion: ""
                  rol: "admin"
                  activo: true
    post:
      tags:
        - Usuarios
      summary: Crear nuevo usuario
      description: Servicio Firebase - DashboardManager.guardarUsuario() - Solo para admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
            example:
              run: "12345678-9"
              nombre: "Nuevo Usuario"
              email: "nuevo@ejemplo.com"
              clave: "contraseña123"
              fecha: "1990-05-15"
              telefono: "+56912345678"
              direccion: "Calle Nueva 123"
              rol: "cliente"
              activo: true
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: "nuevoIdGeneradoPorFirestore123"
                message: "Usuario creado correctamente"
        '400':
          description: Datos de usuario inválidos

  /api/usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario por ID
      description: Servicio Firebase - Obtener detalles de usuario específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "user123"
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: "user123"
                run: "12345678-9"
                nombre: "Juan Pérez"
                email: "juan@ejemplo.com"
                fecha: "1990-05-15"
                telefono: "+56912345678"
                direccion: "Calle Falsa 123"
                rol: "cliente"
                activo: true
                createdAt: "2024-01-01T00:00:00Z"
        '404':
          description: Usuario no encontrado

    put:
      tags:
        - Usuarios
      summary: Actualizar usuario existente
      description: Servicio Firebase - DashboardManager.guardarUsuario() - Solo para admins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "user123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
            example:
              run: "12345678-9"
              nombre: "Juan Pérez Actualizado"
              email: "juan@ejemplo.com"
              fecha: "1990-05-15"
              telefono: "+56912345678"
              direccion: "Calle Falsa 123"
              rol: "cliente"
              activo: false
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Usuario actualizado correctamente"
        '404':
          description: Usuario no encontrado

    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario del sistema
      description: Servicio Firebase - DashboardManager.eliminarUsuario() - Solo para admins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "user123"
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Usuario eliminado correctamente"
        '404':
          description: Usuario no encontrado

  /api/productos:
    get:
      tags:
        - Productos
      summary: Obtener lista de productos
      description: Servicio Firebase - DashboardManager.cargarProductos() / VendedorManager.cargarProductos()
      responses:
        '200':
          description: Lista de productos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
              example:
                - id: "prod123"
                  nombre: "Laptop Gaming"
                  precio: 1299990
                  stock: 15
                  categoria: "Tecnología"
                  imagen: "https://ejemplo.com/laptop.jpg"
                  estado: "Activo"
                - id: "prod456"
                  nombre: "Mouse Inalámbrico"
                  precio: 49990
                  stock: 30
                  categoria: "Accesorios"
                  imagen: "https://ejemplo.com/mouse.jpg"
                  estado: "Activo"
                - id: "prod789"
                  nombre: "Teclado Mecánico"
                  precio: 89990
                  stock: 25
                  categoria: "Accesorios"
                  estado: "Activo"
    post:
      tags:
        - Productos
      summary: Crear un nuevo producto
      description: Servicio Firebase - DashboardManager.guardarProducto() - Solo para admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
            example:
              nombre: "Tablet Android 10''"
              precio: 299990
              stock: 25
              categoria: "Tecnología"
              imagen: "https://ejemplo.com/tablet.jpg"
      responses:
        '201':
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: "nuevoIdGeneradoPorFirestore123"
        '400':
          description: Datos de producto inválidos

  /api/productos/{id}:
    get:
      tags:
        - Productos
      summary: Obtener producto por ID
      description: Servicio Firebase - Obtener detalles de producto específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "prod123"
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              example:
                id: "prod123"
                nombre: "Laptop Gaming"
                precio: 1299990
                stock: 15
                categoria: "Tecnología"
                imagen: "https://ejemplo.com/laptop.jpg"
                estado: "Activo"
        '404':
          description: Producto no encontrado

    put:
      tags:
        - Productos
      summary: Actualizar producto existente
      description: Servicio Firebase - DashboardManager.guardarProducto() - Solo para admins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "prod123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
            example:
              nombre: "Laptop Gaming Pro"
              precio: 1399990
              stock: 10
              categoria: "Tecnología Premium"
              imagen: "https://ejemplo.com/laptop.jpg"
      responses:
        '200':
          description: Producto actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Producto actualizado correctamente"
        '404':
          description: Producto no encontrado

    delete:
      tags:
        - Productos
      summary: Eliminar producto del sistema
      description: Servicio Firebase - DashboardManager.eliminarProducto() - Solo para admins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "prod123"
      responses:
        '200':
          description: Producto eliminado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Producto eliminado correctamente"
        '404':
          description: Producto no encontrado

  /api/categorias:
    get:
      tags:
        - Categorías
      summary: Obtener lista de categorías
      description: Servicio Firebase - DashboardManager.cargarCategorias() / VendedorManager.cargarCategorias()
      responses:
        '200':
          description: Lista de categorías obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
              example:
                - id: "cat123"
                  nombre: "Electrónicos"
                  descripcion: "Dispositivos electrónicos y tecnológicos"
                  estado: "Activa"
                - id: "cat124"
                  nombre: "Hogar"
                  descripcion: "Productos para el hogar"
                  estado: "Activa"
                - id: "cat125"
                  nombre: "Ropa"
                  descripcion: "Ropa y accesorios"
                  estado: "Inactiva"

  /api/compras:
    get:
      tags:
        - Compras/Órdenes
      summary: Obtener lista de órdenes
      description: Servicio Firebase - DashboardManager.cargarOrdenes() / VendedorManager.cargarOrdenes()
      responses:
        '200':
          description: Lista de órdenes obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Compra'
              example:
                - id: "orden123"
                  cliente:
                    run: "12345678-9"
                    nombre: "Juan Pérez"
                    correo: "juan@ejemplo.com"
                  total: 199990
                  estado: "completado"
                  fecha: "2024-01-15T10:30:00Z"
                  productos:
                    - id: "prod123"
                      nombre: "Laptop Gaming"
                      cantidad: 1
                      precio: 1299990
                    - id: "prod456"
                      nombre: "Mouse Inalámbrico"
                      cantidad: 1
                      precio: 49990
                - id: "orden124"
                  cliente:
                    run: "87654321-0"
                    nombre: "María García"
                    correo: "maria@ejemplo.com"
                  total: 299990
                  estado: "procesando"
                  fecha: "2024-01-14T15:45:00Z"
                  productos:
                    - id: "prod789"
                      nombre: "Teclado Mecánico"
                      cantidad: 2
                      precio: 89990

  /api/compras/{id}:
    get:
      tags:
        - Compras/Órdenes
      summary: Obtener orden por ID
      description: Servicio Firebase - Obtener detalles de orden específica
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "orden123"
      responses:
        '200':
          description: Orden encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compra'
              example:
                id: "orden123"
                cliente:
                  run: "12345678-9"
                  nombre: "Juan Pérez"
                  correo: "juan@ejemplo.com"
                total: 199990
                estado: "completado"
                fecha: "2024-01-15T10:30:00Z"
                productos:
                  - id: "prod123"
                    nombre: "Laptop Gaming"
                    cantidad: 1
                    precio: 1299990
                  - id: "prod456"
                    nombre: "Mouse Inalámbrico"
                    cantidad: 1
                    precio: 49990
        '404':
          description: Orden no encontrada

  /api/compras/{id}/estado:
    put:
      tags:
        - Compras/Órdenes
      summary: Actualizar estado de orden
      description: Servicio Firebase - DashboardManager.guardarEstadoOrden() / VendedorManager.funcionalidad similar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "orden123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  enum: [pendiente, procesando, completado, cancelado]
            example:
              estado: "completado"
      responses:
        '200':
          description: Estado actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: "Estado actualizado a completado"
        '404':
          description: Orden no encontrada

  /api/dashboard/estadisticas:
    get:
      tags:
        - Dashboard
      summary: Obtener estadísticas del dashboard
      description: Servicio Firebase - DashboardManager.cargarEstadisticasReales() - Solo para admins y vendedores
      responses:
        '200':
          description: Estadísticas obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasDashboard'
              example:
                totalVentas: 24
                proyeccionVentas: 15
                totalProductos: 156
                inventarioTotal: 1248
                totalUsuarios: 89
                nuevosUsuariosMes: 12

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UsuarioAutenticado:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        correo:
          type: string
          format: email
        run:
          type: string
        rol:
          type: string
          enum: [cliente, vendedor, admin]
        activo:
          type: boolean
        token:
          type: string

    Usuario:
      type: object
      properties:
        id:
          type: string
        run:
          type: string
        nombre:
          type: string
        email:
          type: string
          format: email
        fecha:
          type: string
          format: date
        telefono:
          type: string
        direccion:
          type: string
        rol:
          type: string
          enum: [cliente, vendedor, admin]
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UsuarioInput:
      type: object
      required:
        - run
        - nombre
        - email
        - clave
        - rol
      properties:
        run:
          type: string
          example: "12345678-9"
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@ejemplo.com"
        clave:
          type: string
          example: "contraseña123"
        fecha:
          type: string
          format: date
          example: "1990-05-15"
        telefono:
          type: string
          example: "+56912345678"
        direccion:
          type: string
          example: "Calle Falsa 123"
        rol:
          type: string
          enum: [cliente, vendedor, admin]
          example: "cliente"
        activo:
          type: boolean
          example: true

    UsuarioUpdate:
      type: object
      properties:
        run:
          type: string
          example: "12345678-9"
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@ejemplo.com"
        fecha:
          type: string
          format: date
          example: "1990-05-15"
        telefono:
          type: string
          example: "+56912345678"
        direccion:
          type: string
          example: "Calle Falsa 123"
        rol:
          type: string
          enum: [cliente, vendedor, admin]
          example: "cliente"
        activo:
          type: boolean
          example: true

    Producto:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
          example: "Laptop Gaming"
        precio:
          type: integer
          example: 1299990
        stock:
          type: integer
          example: 15
        categoria:
          type: string
          example: "Tecnología"
        imagen:
          type: string
          format: uri
        estado:
          type: string
          example: "Activo"

    ProductoInput:
      type: object
      required:
        - nombre
        - precio
        - stock
        - categoria
      properties:
        nombre:
          type: string
          example: "Laptop Gaming"
        precio:
          type: integer
          example: 1299990
        stock:
          type: integer
          example: 15
        categoria:
          type: string
          example: "Tecnología"
        imagen:
          type: string
          format: uri
          example: "https://ejemplo.com/laptop.jpg"

    Categoria:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
          example: "Electrónicos"
        descripcion:
          type: string
          example: "Dispositivos electrónicos y tecnológicos"
        estado:
          type: string
          example: "Activa"

    Compra:
      type: object
      properties:
        id:
          type: string
        cliente:
          type: object
          properties:
            run:
              type: string
            nombre:
              type: string
            correo:
              type: string
              format: email
        total:
          type: integer
        estado:
          type: string
          enum: [pendiente, procesando, completado, cancelado]
        fecha:
          type: string
          format: date-time
        productos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              nombre:
                type: string
              cantidad:
                type: integer
              precio:
                type: integer

    EstadisticasDashboard:
      type: object
      properties:
        totalVentas:
          type: integer
          example: 24
        proyeccionVentas:
          type: integer
          example: 15
        totalProductos:
          type: integer
          example: 156
        inventarioTotal:
          type: integer
          example: 1248
        totalUsuarios:
          type: integer
          example: 89
        nuevosUsuariosMes:
          type: integer
          example: 12

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
