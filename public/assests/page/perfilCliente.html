<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Cliente - Level-Up Gamer</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Estilos de tu proyecto -->
  <link rel="stylesheet" href="../css/estilos.css">

  <style>
    body {
      background-color: #0a0a0f;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Layout principal */
    .main-section {
      flex: 1;
      display: flex;
      margin-top: 40px;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: rgba(15, 15, 25, 0.95);
      border-right: 2px solid #1E90FF;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 4px 0 15px rgba(30, 144, 255, 0.2);
    }

    .btn-gaming {
      background: linear-gradient(90deg, #1E90FF, #0066CC);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 12px;
      padding: 12px 15px;
      text-align: left;
      transition: all 0.3s ease;
    }

    .btn-gaming i {
      margin-right: 10px;
    }

    .btn-gaming:hover {
      transform: translateX(6px);
      box-shadow: 0px 0px 15px rgba(30, 144, 255, 0.5);
    }

    /* Contenido central */
    .content-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .neon-card {
      background: rgba(20, 20, 30, 0.9);
      border: 2px solid #1E90FF;
      border-radius: 20px;
      padding: 50px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 0 20px rgba(30, 144, 255, 0.2);
      transition: 0.3s ease-in-out;
    }

    .neon-card:hover {
      box-shadow: 0 0 40px rgba(30, 144, 255, 0.5);
      transform: scale(1.02);
    }

    .floating-icon {
      font-size: 4rem;
      color: #1E90FF;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .neon-card h2 {
      font-family: 'Orbitron', sans-serif;
      color: #1E90FF;
      margin-bottom: 15px;
    }

    /* Botón de cerrar sesión en la parte inferior izquierda */
    .logout-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
    }

    .btn-logout {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: #c82333;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
    }

    /* Responsividad */
    @media (max-width: 768px) {
      .main-section {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        border-right: none;
        border-bottom: 2px solid #1E90FF;
      }
      .btn-gaming {
        width: auto;
        text-align: center;
        font-size: 0.9rem;
      }
      
      .logout-container {
        bottom: 10px;
        left: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Main Layout -->
  <section class="main-section">
    <!-- Sidebar izquierda -->
    <div class="sidebar">
      <button class="btn btn-gaming"><i class="bi bi-speedometer2"></i>Dashboard Cliente</button>
      <button class="btn btn-gaming"><i class="bi bi-bag-check"></i>Historial de Compra</button>
      <button class="btn btn-gaming"><i class="bi bi-chat-left-text"></i>Historial de Reseñas</button>
    </div>

    <!-- Contenido central -->
    <div class="content-area">
      <div class="neon-card">
        <i class="bi bi-controller floating-icon"></i>
        <h2 id="mensajeBienvenida">Cargando...</h2>
        <p>Desde aquí podrás gestionar tus compras, revisar tus reseñas y mantenerte al tanto de tus puntos Level-Up.</p>
      </div>
    </div>
  </section>

  <!-- Botón de cerrar sesión en la parte inferior izquierda -->
  <div class="logout-container">
    <button id="btnCerrarSesion" class="btn-logout">
      <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
    </button>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Level-Up Gamer — Potenciado por pasión gamer 🎮
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script para mostrar nombre de usuario y cerrar sesión -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const mensajeBienvenida = document.getElementById('mensajeBienvenida');
        const btnCerrarSesion = document.getElementById('btnCerrarSesion');
        
        // Obtener el usuario del localStorage
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        
        if (usuario && usuario.nombre) {
            // Mostrar mensaje personalizado con el nombre del usuario
            mensajeBienvenida.textContent = `¡Bienvenido, ${usuario.nombre}!`;
        } else {
            // Si no hay usuario, redirigir al login
            window.location.href = 'login.html';
        }
        
        // Configurar botón de cerrar sesión
        if (btnCerrarSesion) {
            btnCerrarSesion.addEventListener('click', function() {
                // Eliminar usuario y carrito de localStorage
                localStorage.removeItem('usuario');
                localStorage.removeItem('carrito');
                
                // Redirigir al index.html
                window.location.href = '../../index.html';
            });
        }
    });
  </script>
</body>
</html>
