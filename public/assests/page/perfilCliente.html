<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Cliente - Level-Up Gamer</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Estilos de tu proyecto -->
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/perfil.css">
    
</head>
<body>
  <!-- Main Layout -->
  <section class="main-section">
    <!-- Sidebar izquierda -->
    <div class="sidebar">
      <button class="btn btn-gaming"><i class="bi bi-speedometer2"></i>Dashboard Cliente</button>
      <button class="btn btn-gaming"><i class="bi bi-bag-check"></i>Historial de Compra</button>
      <button class="btn btn-gaming"><i class="bi bi-chat-left-text"></i>Historial de Reseñas</button>
    </div>

    <!-- Contenido central -->
    <div class="content-area">
      <div class="neon-card">
        <i class="bi bi-controller floating-icon"></i>
        <h2 id="mensajeBienvenida">Cargando...</h2>
        <p>Desde aquí podrás gestionar tus compras, revisar tus reseñas y mantenerte al tanto de tus puntos Level-Up.</p>
      </div>
    </div>
  </section>

  <!-- Botón de cerrar sesión en la parte inferior izquierda -->
  <div class="logout-container">
    <button id="btnCerrarSesion" class="btn-logout">
      <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
    </button>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Level-Up Gamer — Potenciado por pasión gamer 🎮
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script para mostrar nombre de usuario y cerrar sesión -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const mensajeBienvenida = document.getElementById('mensajeBienvenida');
        const btnCerrarSesion = document.getElementById('btnCerrarSesion');
        
        // Obtener el usuario del localStorage
        const usuario = JSON.parse(localStorage.getItem('usuario'));
        
        if (usuario && usuario.nombre) {
            // Mostrar mensaje personalizado con el nombre del usuario
            mensajeBienvenida.textContent = `¡Bienvenido, ${usuario.nombre}!`;
        } else {
            // Si no hay usuario, redirigir al login
            window.location.href = 'login.html';
        }
        
        // Configurar botón de cerrar sesión
        if (btnCerrarSesion) {
            btnCerrarSesion.addEventListener('click', function() {
                // Eliminar usuario y carrito de localStorage
                localStorage.removeItem('usuario');
                localStorage.removeItem('carrito');
                
                // Redirigir al index.html
                window.location.href = '../../index.html';
            });
        }
    });
  </script>
</body>
</html>
